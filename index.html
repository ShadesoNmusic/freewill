<style>
html,body{overscroll-behavior:none;overflow-x:clip}
/* the selected piece is unmistakable: gold fill, thick gold ring, bold label */
#game-panel button.sel{background:#ffd84a !important;color:#000 !important;border:3px solid #fff6c8 !important;font-weight:bold;box-shadow:0 0 0 3px #ffd84a66,0 0 14px #ffd84a88;transform:scale(1.04)}
body{margin:0;background:#202020;color:#ddd;font-family:monospace;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-tap-highlight-color:transparent}

#hud{margin:12px 8px 6px;font-size:15px;text-align:center;line-height:1.5;height:4.6em;overflow:hidden;max-width:96vw;display:flex;flex-direction:column;justify-content:center}

canvas#c{image-rendering:auto;border:2px solid #444;border-radius:6px;width:min(96vw,640px,calc(100svh - 230px));min-width:280px;height:auto;aspect-ratio:1;touch-action:none;box-sizing:border-box}
canvas#graph{width:min(96vw,640px);height:auto;border-radius:4px}

@media (pointer:coarse),(max-width:700px){
 #hud{font-size:12.5px;height:5.4em;margin-top:6px}
 /*  */

    the page has bottom padding equal to the bar, so nothing ends up stuck underneath it */
 body{padding-bottom:calc(68px + env(safe-area-inset-bottom)) !important}
 /* piece tray: one row right under the board, swipe sideways for more pieces, thumb-sized buttons */
 #g-tray{display:flex;flex-wrap:nowrap;justify-content:safe center;gap:6px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;padding:4px 8px 8px;margin:0 -6px;scrollbar-width:none;max-width:100vw;box-sizing:border-box;mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 22px),transparent)}
 #g-tray::-webkit-scrollbar{display:none}
 #g-tray button{flex:none;scroll-snap-align:start;margin:0 !important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:74px;padding:6px 8px !important;font-size:12px !important;line-height:1.2;white-space:nowrap}
 #g-tray button canvas.feel-pv{margin:0 !important;width:30px !important;height:30px !important}
 body > #feel-tools{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(64px + env(safe-area-inset-bottom));padding:0 10px env(safe-area-inset-bottom);box-sizing:border-box;align-items:center;justify-content:flex-start;background:rgba(24,24,24,.96);border-top:1px solid #444}
 body > #feel-tools select,body > #feel-tools button{margin:0 5px 0 0 !important;padding:8px 8px !important}
 body > #feel-tools #feel-theme{max-width:34vw;min-width:min(112px,30vw) !important;flex:none}
 #feel-tools #feel-music,#feel-tools #feel-mute{min-width:44px !important;min-height:44px}
 #hud small,#game-panel small{font-size:12px !important}
 #game-panel button[data-a=ready]{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:31;margin:0 !important;background:#808080 !important;color:#000 !important;font-weight:bold;min-width:120px}
 button{min-height:44px;min-width:44px;font-size:15px !important;padding:8px 12px !important;margin:4px !important;border-radius:8px}
 input[type=range]{height:32px;width:46vw}
 #feel-mute,#feel-theme,#feel-music{position:static !important;display:inline-block;margin:10px 4px 18px !important;font-size:14px !important;padding:8px !important;min-height:44px}
 #feel-tools{display:flex;justify-content:center}
 #feel-title h1{letter-spacing:1px}
 #feel-title button{min-width:min(300px,86vw) !important}
 #feel-title p{font-size:13px;margin:4px 12px 16px}
